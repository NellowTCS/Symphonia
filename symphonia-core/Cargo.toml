[package]
name = "symphonia-core"
description = "Project Symphonia shared structs, traits, and features."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "codec", "decoder", "multimedia", "media"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["std"]

# Enable standard-library I/O support. Disable for `no_std` (default-features = false).
#
# Under `std`, float and complex math is routed through the standard library. The crate-level
# `libm` feature is intentionally left enabled on the `num-traits`/`num-complex` dependencies:
# when both `std` and `libm` are active, `num-traits` selects its `std` implementations, so the
# software `libm` fallbacks are only used in `no_std` builds.
std = ["num-traits/std", "num-complex/std"]

# SIMD support.
opt-simd-sse = ["rustfft/sse"]
opt-simd-avx = ["rustfft/avx"]
opt-simd-neon = ["rustfft/neon"]

# Enable all SIMD support.
opt-simd = [
    "opt-simd-sse",
    "opt-simd-avx",
    "opt-simd-neon",
]

# Experimental features.
exp-subtitle-codecs = []
exp-video-codecs = []

[dependencies]
bitflags = "2.4.2"
bytemuck = "1.7"
embedded-io = { version = "0.7", default-features = false }
hashbrown = { version = "0.17", default-features = false, features = ["alloc", "default-hasher"] }
log = { workspace = true }
num-complex = { version = "0.4", default-features = false }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
once_cell = { version = "1.21", default-features = false, features = ["alloc", "race"] }
smallvec = { workspace = true }

[dependencies.rustfft]
version = "6.1.0"
optional = true
default-features = false

[dev-dependencies.rand]
version = "0.10.0"

default-features = false

[lints]
workspace = true
