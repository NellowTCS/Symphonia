[package]
name = "symphonia-codec-vorbis"
description = "Pure Rust Vorbis decoder (a part of project Symphonia)."
authors = ["Philip Deljanov <philip.deljanov@gmail.com>"]
readme = "README.md"
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]
keywords = ["audio", "codec", "decoder", "vorbis"]
# Common package metadata located in workspace Cargo.toml.
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["std"]

# Enable standard-library I/O support. Disable for `no_std` (default-features = false).
std = ["symphonia-core/std", "symphonia-common/std", "num-traits/std"]

[dependencies]
log = { workspace = true }
hashbrown = { version = "0.17", default-features = false, features = ["alloc", "default-hasher"] }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }

[dependencies.symphonia-core]
version = "0.6.1"
path = "../symphonia-core"
default-features = false

[dependencies.symphonia-common]
version = "0.6.1"
path = "../symphonia-common"
default-features = false

[lints]
workspace = true
